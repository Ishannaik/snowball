[project]
name = "snowball"
version = "1.0.0"
description = "Autonomous 24/7 research agent that never repeats itself"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "curl_cffi>=0.15.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.49",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (syntax, unused imports, undefined variables)
    "I",      # isort (import cleanliness)
    "B",      # flake8-bugbear (common bug patterns)
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (modern Python syntax)
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # Line length handled by formatter
    "B008",   # function call in argument defaults
    "E402",   # module level import not at top of file (sys.path guard in orchestrator)
]

[tool.ruff.lint.mccabe]
max-complexity = 18
