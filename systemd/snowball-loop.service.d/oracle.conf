[Unit]
# Oracle runs AGY and Exa locally; do not start the older cross-host tunnels.
Wants=
After=
After=network-online.target antigravity-pool.service
Wants=network-online.target antigravity-pool.service

[Service]
EnvironmentFile=/home/ubuntu/repos/snowball/config.oracle.env
# Explicit HTTP requests use no OMP memory, extensions or provider fallback.
ExecStart=
ExecStart=/home/ubuntu/repos/snowball/.venv/bin/python /home/ubuntu/repos/snowball/snowball.py goal --db /home/ubuntu/repos/snowball/data/snowball.db supervise --max-waves 5
