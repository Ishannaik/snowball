[Unit]
# Oracle runs AGY and Exa locally; do not start the older cross-host tunnels.
Wants=
After=
After=network-online.target antigravity-pool.service
Wants=network-online.target antigravity-pool.service

[Service]
EnvironmentFile=/home/ubuntu/repos/snowball/config.oracle.env
# OMP may update provider/auth/cache state even with --no-session.
ReadWritePaths=/home/ubuntu/.omp/agent
ExecStart=
ExecStart=/home/ubuntu/repos/snowball/.venv/bin/python /home/ubuntu/repos/snowball/snowball.py supervise --db /home/ubuntu/repos/snowball/data/highered.db --topics /home/ubuntu/repos/snowball/topics.highered.yml --max-topics 1 --mode gemini-bulk --json
