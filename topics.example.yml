# Seed topics. Snowball grows this list by itself from what it reads.
# Copy to topics.yml. Families set the re-check timer and the drift guard.
families:
  opportunities: {recheck_days: 14}
  competitors: {recheck_days: 30}
  alpha: {recheck_days: 1}
seeds:
  - {id: startup-grants, family: opportunities, focus: "non-dilutive grants and programs open to early-stage software founders in India and the UAE"}
  - {id: scholarships, family: opportunities, focus: "scholarships and fellowships for developers and students, open now"}
  - {id: research-grants, family: opportunities, focus: "research and open-source grants (foundations, protocol grants, OSS funds)"}
  - {id: hackathons, family: opportunities, focus: "online hackathons with cash prizes, open to India-based participants"}
  - {id: free-credits, family: opportunities, focus: "free cloud, GPU and API credit programs and startup perks"}
  - {id: competitors, family: competitors, focus: "products competing with our projects; pricing, launches, gaps"}
  - {id: alpha-news, family: alpha, focus: "new AI tools, models and infra tricks before they are widely known"}
